name: Android CI
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create local.properties
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          TRIVIA_API_KEY: ${{ secrets.TRIVIA_API_KEY }}
        run: |
          echo "GOOGLE_SERVER_CLIENT_ID=$GOOGLE_CLIENT_ID" > local.properties
          echo "TRIVIA_API_KEY=$TRIVIA_API_KEY" > local.properties

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
